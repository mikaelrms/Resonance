<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Adicionar nova banda</title>
</head>
<body>
    <a href="index.html" class="home-link">← Voltar</a>
    <form action="" method="post">
    <h2>Cadastrar Banda</h2>

    <label for="nome">Nome da banda:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="img">Imagem da banda:</label>
    <input type="file" name="imagem">

    <label for="descricao">Descrição:</label>
    <textarea id="descricao" name="descricao" rows="5"></textarea>

    <label for="musica">Música favorita:</label>
    <input type="text" id="musica" name="musica">

    <label for="link-musica">Link do youtube:</label>
    <input type="url" id="linkMusica" name="linkMusica">

    <label for="fonte">Fonte:</label>
    <input type="text" id="fonte" name="fonte">

    <button type="submit">Cadastrar banda</button>
</form>
</body>
</html>
